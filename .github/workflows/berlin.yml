name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build de l'image Docker
        run: docker build -t velstore .

      - name: Export de l'image
        run: docker save velstore -o image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Chargement de l'image
        run: docker load -i image.tar

      - name: Tests Laravel
        run: docker run --rm velstore php artisan test

  scan:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Chargement de l'image
        run: docker load -i image.tar

      - name: Scan Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: velstore
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  push:
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Chargement de l'image
        run: docker load -i image.tar

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag et push
        run: |
          docker tag velstore ${{ secrets.DOCKERHUB_USERNAME }}/velstore:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/velstore:latest
