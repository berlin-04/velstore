services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: velstore-app
    restart: unless-stopped
    volumes:
      - ./storage:/var/www/html/storage
      - ./.env:/var/www/html/.env
    
    depends_on:
      - db
    networks:
      - velstore-net

  nginx:
    image: nginx:stable-alpine
    container_name: velstore-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on:
      - app
    networks:
      - velstore-net

  db:
    image: mysql:8.0
    container_name: velstore-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: velstore1
      MYSQL_ROOT_PASSWORD: changeme
      MYSQL_USER: velstore
      MYSQL_PASSWORD: changeme
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - velstore-net

volumes:
  db-data:

networks:
  velstore-net:
    driver: bridge
